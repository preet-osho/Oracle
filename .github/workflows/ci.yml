# ═══════════════════════════════════════
# ORACLE — CI Pipeline
# Runs typecheck, tests, lint, and schema validation on every push and PR
# ═══════════════════════════════════════

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Run strict typecheck (Q3 files)
        run: npm run typecheck:strict

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npx next lint --dir src

  test-p1:
    name: 'Tests: P1 Critical'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run P1 Critical tests
        run: npx tsx scripts/run-by-priority.ts P1

  test-p2:
    name: 'Tests: P2 High Risk'
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test-p1]
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run P2 High Risk tests
        run: npx tsx scripts/run-by-priority.ts P2

  test-p3:
    name: 'Tests: P3 Medium Risk'
    runs-on: ubuntu-latest
    needs: test-p2
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run P3 Medium Risk tests
        run: npx tsx scripts/run-by-priority.ts P3

  test-p4-plus:
    name: 'Tests: P4-P6 Low Risk'
    runs-on: ubuntu-latest
    needs: test-p3
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run P4 Low Risk tests
        run: npx tsx scripts/run-by-priority.ts P4

      - name: Run P5 Backlog tests
        run: npx tsx scripts/run-by-priority.ts P5

      - name: Run P6 Component tests
        run: npx tsx scripts/run-by-priority.ts P6

  coverage-report:
    name: 'Coverage Report by Priority Tier'
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test-p1, test-p2, test-p3, test-p4-plus]
    if: always() && needs.test-p1.result == 'success' && needs.typecheck.result == 'success' && needs.lint.result == 'success'
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run coverage across all priority tiers
        run: npx tsx scripts/run-by-priority.ts --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-by-tier
          path: coverage-priority/
          retention-days: 30

      - name: Upload coverage summary to PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const summaryPath = path.join('coverage-priority', 'coverage-summary.json');
            if (!fs.existsSync(summaryPath)) {
              console.log('No coverage summary found, skipping PR comment.');
              return;
            }
            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf-8'));
            let body = '<!-- coverage-report -->\n## 📊 Coverage Report by Priority Tier\n\n';
            body += '| Tier | Lines | Branches | Functions | Tests | Status |\n';
            body += '|------|-------|----------|-----------|-------|--------|\n';
            for (const tier of summary) {
              if (tier.coverage) {
                const pct = tier.coverage.lines.pct;
                const icon = pct >= 80 ? '🟢' : pct >= 60 ? '🟡' : '🔴';
                body += `| ${tier.level} | ${tier.coverage.lines.pct.toFixed(1)}% | ${tier.coverage.branches.pct.toFixed(1)}% | ${tier.coverage.functions.pct.toFixed(1)}% | ${tier.tests} | ${icon} |\n`;
              } else {
                body += `| ${tier.level} | — | — | — | ${tier.tests} | ⚪ |\n`;
              }
            }
            body += '\n> Coverage report generated by priority-based test runner.';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('<!-- coverage-report -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  validate-schemas:
    name: Validate JSON-LD Schemas
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run schema validation
        run: npm run validate:schemas

      - name: Upload exported schemas as artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: json-ld-schemas
          path: json-ld-output/
          retention-days: 30
